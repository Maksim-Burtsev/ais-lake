[project]
name = "ais-api"
version = "0.1.0"
description = "ais-lake api: REST /v1, SSR, WS gateway"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "aiokafka[zstd]>=0.12.0",
    "clickhouse-connect[async]>=0.8",
    "redis>=5.2",
    "websockets>=14",  # uvicorn's WS protocol — /v1/live has nothing to talk over without it
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.52",  # alembic's own dep; the [asyncio] extra is what asyncpg needs
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "clickhouse_connect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
