# ais-lake — dev: the bus, the three stores, and the app services.

name: ais-lake

services:
  pipeline:
    build: ./pipeline
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      REDIS_URL: redis://redis:6379/0   # incident log only; the stream runs without it
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  refinery:
    build: ./pipeline
    command: ["uv", "run", "--no-sync", "python", "-m", "ais_pipeline.refinery"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env          # REGION_SLUG above all: the gateway must subscribe to
    environment:            # the same live:{region} the refinery publishes to
      KAFKA_BOOTSTRAP: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: clickhouse
      REGION_SLUG: ${REGION_SLUG:-north-sea}   # same default as pipeline Settings
      LIMITS_PATH: /limits.json
      REGIONS_PATH: /regions.json
    volumes:
      - ./limits.json:/limits.json:ro    # the root files are outside the ./api build context
      - ./regions.json:/regions.json:ro
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # Kafka API for the host
      - "9644:9644"     # admin API / metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ais
      CLICKHOUSE_USER: ais
      CLICKHOUSE_PASSWORD: ais-dev
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 24

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ais
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais -d ais"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  redpanda-data:
  clickhouse-data:
  postgres-data:
  redis-data:
