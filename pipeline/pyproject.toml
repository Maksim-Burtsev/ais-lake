[project]
name = "ais-pipeline"
version = "0.1.0"
description = "ais-lake pipeline: ingestor, refinery, detectors, digester"
requires-python = ">=3.14"
dependencies = [
    "websockets>=15.0",
    "aiokafka[zstd]>=0.12.0",
    "pydantic-settings>=2.7",
    "py-clickhouse-migrator>=0.1",
    "clickhouse-connect[async]>=0.8",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "hypothesis>=6.120",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "clickhouse_connect.*"
ignore_missing_imports = true
