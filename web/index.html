<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ais·lake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- F3: resolve the theme BEFORE React mounts so the shell never flashes.
         Order: ?theme= > localStorage("theme") > local clock (07:00–19:00 = day).
         Keep in sync with src/state/theme.ts (resolveTheme). -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var stored = localStorage.getItem('theme');
          var hour = new Date().getHours();
          var theme =
            q === 'night' || q === 'day'
              ? q
              : stored === 'night' || stored === 'day'
                ? stored
                : hour >= 7 && hour < 19
                  ? 'day'
                  : 'night';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'night');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
